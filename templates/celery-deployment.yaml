apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "grader-api.fullname" . }}-celery
  labels:
    {{- include "grader-api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "grader-api.flowerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "grader-api.flowerSelectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "grader-api.fullname" . }}-sa
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        {{- if .Values.postgresql.enabled }}
        - name: wait-for-postgresql
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: "{{ .Values.postgresql.image.pullPolicy }}"
          command:
            - sh
            - -c
            - until pg_isready -h {{ include "grader-api.fullname" . }}-postgresql -p 5432 -U postgres; do echo "waiting for postgresql"; sleep 5; done
        {{- end }}
        {{ if .Values.rabbitmq.enabled }}
        - name: wait-for-rabbitmq
          image: busybox:1.28
          command: ['sh', '-c', 'until nc -z {{ printf "%s%s" (include "grader-api.fullname" .) "-rabbitmq" }} 5672; do echo waiting for rabbitmq; sleep 2; done;']
        {{ end }}
        {{ if .Values.redis.enabled }}
        - name: wait-for-redis
          image: goodsmileduck/redis-cli:6.0.4
          command: ['sh', '-c', 'until [ "$(redis-cli -h ${REDIS_HOST} -p ${REDIS_PORT} -a ${REDIS_PASSWORD} --user ${REDIS_USER} ping | grep PONG)" = "PONG" ]; do echo waiting for redis; sleep 2; done;']
          env:
          - name: REDIS_HOST
            valueFrom:
              configMapKeyRef:
                name: {{ include "grader-api.fullname" . }}
                key: BROKER_HOST
          - name: REDIS_PORT
            valueFrom:
              configMapKeyRef:
                name: {{ include "grader-api.fullname" . }}
                key: BROKER_PORT
          - name: REDIS_USER
            valueFrom:
              configMapKeyRef:
                name: {{ include "grader-api.fullname" . }}
                key: BROKER_USER
          - name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ include "grader-api.redisSecretName" . }}
                key: BROKER_PASSWORD
        {{ end }}
      containers:
        - name: celery
          securityContext:
            {{- toYaml .Values.celery.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["celery"]
          args: [
            "-A", "app.celery",
            "{{ .Values.celery.workerOptions.name }}",
            "--pool", "{{ .Values.celery.workerOptions.pool }}",
            "--concurrency", "{{ .Values.celery.workerOptions.concurrency }}",
            "--loglevel", "{{ .Values.celery.workerOptions.loglevel }}"
          ]
          # livenessProbe:
          #   exec:
          #     command: [
          #       "celery",
          #       "-A", "app.celery",
          #       "inspect",
          #       "ping",
          #       # "-d", "celery@$HOSTNAME",
          #       "--timeout", "5"
          #     ]
          #   initialDelaySeconds: 60
          #   timeoutSeconds: 10
          # readinessProbe:
          #   exec:
          #     command: [
          #       "celery",
          #       "-A", "app.celery",
          #       "inspect",
          #       "ping",
          #       # "-d", "celery@$HOSTNAME",
          #       "--timeout", "5"
          #     ]
          #   initialDelaySeconds: 60
          #   timeoutSeconds: 10
          resources:
            {{- toYaml .Values.celery.resources | nindent 12 }}
          envFrom:
          - configMapRef:
              name: {{ include "grader-api.fullname" . }}
          - secretRef:
              name: {{ include "grader-api.fullname" . }}
          {{- if .Values.postgresql.enabled }}
          - secretRef:
              name: {{ .Values.postgresql.auth.existingSecret }}
          {{- end }}
          {{- if .Values.rabbitmq.enabled }}
          - secretRef:
              name: {{ .Values.rabbitmq.auth.existingPasswordSecret }}
          {{- end }}
          {{- if .Values.redis.enabled }}
          - secretRef:
              name: {{ .Values.redis.auth.existingSecret }}
          {{- end }}
        {{- if .Values.celery.flower.enabled }}
        - name: flower
          securityContext:
            {{- toYaml .Values.celery.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["celery"]
          args: [
            "-A", "app.celery",
            "flower"
          ]
          ports:
            - name: http
              containerPort: 5555
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: 5555
            initialDelaySeconds: 60
          readinessProbe:
            tcpSocket:
              port: 5555
            initialDelaySeconds: 60
          resources:
            {{- toYaml .Values.celery.resources | nindent 12 }}
          envFrom:
          - configMapRef:
              name: {{ include "grader-api.fullname" . }}
          - secretRef:
              name: {{ include "grader-api.fullname" . }}
          {{- if .Values.postgresql.enabled }}
          - secretRef:
              name: {{ .Values.postgresql.auth.existingSecret }}
          {{- end }}
          {{- if .Values.rabbitmq.enabled }}
          - secretRef:
              name: {{ .Values.rabbitmq.auth.existingPasswordSecret }}
          {{- end }}
          {{- if .Values.redis.enabled }}
          - secretRef:
              name: {{ .Values.redis.auth.existingSecret }}
          {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
