{{- if and (.Values.config.enabled) (.Values.config.secretData) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "grader-api.fullname" . }}
stringData:
  {{- toYaml .Values.config.secretData | nindent 2 }}
  {{- $flowerPassword := "" }}
  {{ if .Values.celery.flower.auth.password }}
  {{- $flowerPassword = .Values.celery.flower.auth.password }}
  {{- else }}
  {{- if .Release.IsInstall }}
  {{- $flowerPassword = randAlphaNum 20 }}
  {{ else }}
  {{- $flowerPassword = index (lookup "v1" "Secret" .Release.Namespace ( include "grader-api.fullname" . )).data "FLOWER_PASSWORD" | b64dec }}
  {{ end }}
  {{- end }}
  FLOWER_PASSWORD: {{ $flowerPassword }}
  FLOWER_BASIC_AUTH: "{{ .Values.celery.flower.auth.username }}:{{ $flowerPassword }}"
{{- end }}